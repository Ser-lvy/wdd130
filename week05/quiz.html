<html!DOCKTYPE html>
    <html lang="eng">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz</title>
        <link rel="stylesheet" href="styles/quiz.css">
    </head>

    <body>
        <h1>HTML QUIZ</h1>
        <form>
            <label for="q1">1. What form element is used to describe the purpose of the form field?</label>
            <input type="text" id="q1" name="q1">

            <label for="q2">2. What is the purpose of the radio button form filed</label>
            <textarea id="q2" name="q2" rows="5"></textarea>

            <label for="q3">3. Which form element would you use for a yes/no or multiple type question?</label>
            <select id="q3" name="q3">
                <option value="" selected disabled>Choose one.....</option>
                <option value="text_input">Text input</option>
                <option value="label">Label</option>
                <option value="check_box">Check Box</option>
            </select>
            <label for="q4">4. How many h1 elements should a page have?</label>
            <input type="number" name="q4" id="q4">
            <button type="submit">Submit Quiz</button>
        </form>
    </body>

    </html>
